<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="water" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14506a"/>
      <stop offset="1" stop-color="#0a2c3b"/>
    </linearGradient>
    <linearGradient id="pad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5cbf6e"/>
      <stop offset="1" stop-color="#2f8546"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe3ee"/>
      <stop offset="1" stop-color="#f07aa8"/>
    </linearGradient>
    <linearGradient id="petalIn" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f6a9c8"/>
    </linearGradient>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#water)"/>

  <!-- increspature -->
  <g fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="6">
    <ellipse cx="120" cy="120" rx="70" ry="26"/>
    <ellipse cx="120" cy="120" rx="40" ry="14"/>
    <ellipse cx="430" cy="250" rx="44" ry="16"/>
  </g>

  <!-- piccolo koi -->
  <g transform="translate(408 112) rotate(152)">
    <path d="M-34 0 L-62 -20 L-56 0 L-62 20 Z" fill="#f08a3c"/>
    <path d="M-2 -14 L-14 -28 L8 -15 Z M-2 14 L-14 28 L8 15 Z" fill="#f08a3c"/>
    <ellipse cx="0" cy="0" rx="40" ry="16" fill="#f5a04f"/>
    <ellipse cx="12" cy="-2" rx="13" ry="8" fill="#ffffff" fill-opacity="0.85"/>
  </g>

  <!-- foglia piccola -->
  <path d="M392 392 L338 346 A70 70 0 1 1 323 380 Z" fill="url(#pad)"/>
  <g stroke="#226b37" stroke-width="4" stroke-linecap="round" stroke-opacity="0.6">
    <line x1="392" y1="392" x2="440" y2="440"/>
    <line x1="392" y1="392" x2="452" y2="380"/>
    <line x1="392" y1="392" x2="388" y2="456"/>
  </g>

  <!-- foglia grande -->
  <path d="M220 310 L316.4 195.1 A150 150 0 1 1 246 162.3 Z" fill="url(#pad)"/>
  <g stroke="#226b37" stroke-width="5" stroke-linecap="round" stroke-opacity="0.55">
    <line x1="220" y1="310" x2="108" y2="400"/>
    <line x1="220" y1="310" x2="80" y2="300"/>
    <line x1="220" y1="310" x2="130" y2="200"/>
    <line x1="220" y1="310" x2="230" y2="452"/>
    <line x1="220" y1="310" x2="340" y2="400"/>
    <line x1="220" y1="310" x2="364" y2="300"/>
  </g>

  <!-- ninfea -->
  <g transform="translate(300 222)">
    <g fill="url(#petal)">
      <ellipse rx="20" ry="52" cy="-44"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(45)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(90)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(135)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(180)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(225)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(270)"/>
      <ellipse rx="20" ry="52" cy="-44" transform="rotate(315)"/>
    </g>
    <g fill="url(#petalIn)">
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(22.5)"/>
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(82.5)"/>
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(142.5)"/>
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(202.5)"/>
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(262.5)"/>
      <ellipse rx="15" ry="36" cy="-28" transform="rotate(322.5)"/>
    </g>
    <circle r="17" fill="#f6c945"/>
    <circle r="8" fill="#e9a823"/>
  </g>
</svg>
